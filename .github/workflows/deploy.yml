name: サイト公開

on:
  push:
    branches: [main]
  # データ取得ワークフローがデータをコミットしても、それだけでは push イベントが
  # 発火しない（GITHUB_TOKEN による push は連鎖しない仕様）。
  # そのため、取得ワークフローの完了を直接のきっかけにする。
  workflow_run:
    workflows: ["マーケットデータ取得"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時にデプロイが走ると衝突するので、1本ずつ流す
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
