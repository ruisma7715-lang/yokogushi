name: マーケットデータ取得

on:
  schedule:
    # GitHub Actions の cron は UTC 指定。JST = UTC+9。
    #
    # 分を :00 にしない。共有ランナーは毎時ちょうどに実行が集中するため、
    # :00 指定だと実測で2〜8時間遅れて動いていた（データ更新だけなら実害は
    # 小さいが、通知を出すようになると届く時刻がずれて意味が薄れる）。
    - cron: "37 21 * * 0-4" # 日本時間 平日 06:37（NY市場が引けた後）
    - cron: "37 7 * * 1-5" # 日本時間 平日 16:37（東京市場が引けた後）
  workflow_dispatch: # 手動実行用のボタンも出しておく

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 取得したJSONをコミットするために必要

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: データ取得
        run: node scripts/fetch.mjs
        env:
          # リポジトリの Settings > Secrets and variables > Actions で登録する。
          # 未登録でもエラーにはならず、キーが要る資産だけスキップされる。
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      # 通知はコミットより前に置く。notify.mjs は送った内容の指紋を
      # public/data/notified.json に残し、次回それと同じなら送らない
      # （休場日に同じ通知が繰り返し届くと読まれなくなるため）。
      # この状態ファイルを次のステップでコミットさせる必要がある。
      - name: スマホへ通知
        run: node scripts/notify.mjs
        env:
          # 未登録なら何もせず正常終了する。通知の失敗でデータ更新は止めない。
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # fetch.mjs は data だけでなく日次ページ・sitemap・robots も書き出す。
          # data だけを add していた間、毎日作られた記事がコミットされずに消えていた。
          git add public/data public/daily public/sitemap.xml public/robots.txt
          git diff --staged --quiet || git commit -m "data: $(date -u +%Y-%m-%d\ %H:%M) 時点のデータに更新"
          git push
